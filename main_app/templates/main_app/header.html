<header>
    <nav class="navbar navbar-expand bg-body-tertiary border-bottom">

        <div class="container-fluid">
            <a href="/" class="navbar-brand">PhotoApp</a>

            <div class="collapse navbar-collapse" id="navbarNav">
                <div class="navbar-nav">
                  <a class="nav-link active" aria-current="page" href="/">Home</a>

                  <div class="d-flex align-items-center dropdown color-modes">
                    <button class="btn btn-link px-0 text-decoration-none dropdown-toggle d-flex align-items-center" id="bd-theme" type="button" aria-expanded="false" data-bs-toggle="dropdown" data-bs-display="static" aria-label="Toggle theme (dark)">
                      <span class="ms-2" id="bd-theme-text">Toggle theme</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="bd-theme" style="--bs-dropdown-min-width: 8rem;">
                      <li>
                        <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="light" aria-pressed="false">
                          Light
                          <svg class="bi ms-auto d-none"><use href="#check2"></use></svg>
                        </button>
                      </li>
                      <li>
                        <button type="button" class="dropdown-item d-flex align-items-center active" data-bs-theme-value="dark" aria-pressed="true">
                          Dark
                          <svg class="bi ms-auto d-none"><use href="#check2"></use></svg>
                        </button>
                      </li>
                      <li>
                        <button type="button" class="dropdown-item d-flex align-items-center" data-bs-theme-value="auto" aria-pressed="false">
                          Auto
                          <svg class="bi ms-auto d-none"><use href="#check2"></use></svg>
                        </button>
                      </li>
                    </ul>
                  </div>

                </div>
            </div>
            
            {% if user.is_authenticated %}
            <a type="button" class="btn" role="button" href="/upload/">
                <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#5f6368"><path d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>
            </a>

            <a type="button" class="btn" role="button" href="/profile/">
                <img src="https://avatars.githubusercontent.com/u/{{user.social_auth.first.extra_data.id}}"
                alt="PFP"
                style="border-radius: 50%; height: 40px; width: 40px;"
                class="mx-2">
                
                <strong>{{user.username}}</strong>
            </a >
            
            <div>
                <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                    <button role="button" type="submit" class="btn">
                        <svg xmlns="http://www.w3.org/2000/svg" height="32px" viewBox="0 -960 960 960" width="32px" fill="#5f6368"><path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z"/></svg>
                    </button>
                </form>
            </div>

            {% else %}

            <!-- GitHub OAuth redirect -->
            <a type="button" class="btn btn-success" role="button"
            href="{% url 'social:begin' 'github' %}">
                Login via GitHub
            </a>
            {% endif %}
        </div>
    </nav>
</header>
