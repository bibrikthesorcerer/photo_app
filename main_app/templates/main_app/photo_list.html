{% load filters %}
<div class="container text-center">
    <div class="row row-cols-auto">

    {% for ph in photos %} 
      <div class="col m-2 p-4 border border-primary rounded">
        <p><strong>{{ph.title}}</strong><br>
            by {{ph.user.username}}<br>
            {% if user.is_authenticated and ph|is_liked:user %}
              <span class="badge rounded-pill text-bg-danger">{{ph | count_likes}}❤</span>
            {% else %}
              <span class="badge rounded-pill text-bg-light">{{ph | count_likes}}❤</span>
            {% endif %}
        </p>
      </div>
    {% endfor %}

    </div>
  </div>
