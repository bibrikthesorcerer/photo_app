<script>
    document.getElementById('searchBar').addEventListener('keypress', 
        function(event){
            if (event.key == 'Enter'){
                $.ajax({
                    url:'/search',
                    type:'GET',
                    data:{'search_string': this.value},
                    success: function(response){
                        console.log('SERVER RESPONDED:', response);
                        id_arr = response['photos'];
                        postsList = document.getElementById('postsList');
                        cards = postsList.getElementsByClassName('card');
                        for (let card of cards){
                            if (id_arr.indexOf(parseInt(card.id)) < 0){
                                card.hidden = true;
                            }
                            else{
                                card.hidden = false;
                            }
                        }
                    }
                });
            }
        }
    )
</script>
