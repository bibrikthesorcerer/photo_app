{% if comm %}
    <div class="row row-cols-12">
        <div class="col-{{indent}}" id="indent{{comm.id}}" data-indent="{{indent}}"></div>
        <div class="my-2 col">
            <div class="card">
                <div class="card-header">
                    <b>{{ comm.user.username }}</b> on {{ comm.pub_date|date:"d/m/Y H:i:s" }}
                </div>
                <div class="card-body">
                    <h5>{{ comm.text }}</h5>
                </div>
                <div class="m-2 bg-body-primary">
                    <a data-bs-toggle="modal" data-bs-target="#commentModal" 
                    class="btn badge rounded-pill text-bg-primary comment-button"
                    data-id="{{comm.id}}"
                    data-photo-id="{{comm.photo_id}}">
                        <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="32px" fill="#ffffff">
                            <path d="M760-200v-160q0-50-35-85t-85-35H273l144 144-57 56-240-240 240-240 57 56-144 144h367q83 0 141.5 58.5T840-360v160h-80Z"/>
                        </svg>
                    </a>
                    {% if comm.user == request.user and comm.text != "DELETED" and not comm.deleted_at%}
                    <a data-id="{{comm.id}}" class="btn badge rounded-pill text-bg-danger delete-comment-button">
                        <svg xmlns="http://www.w3.org/2000/svg" height="16px" viewBox="0 -960 960 960" width="32px" fill="#ffffff">
                            <path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/>
                        </svg>
                    </a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
{% endif %}
