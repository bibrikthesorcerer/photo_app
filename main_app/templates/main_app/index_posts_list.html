{% load filters %}

<div class="container text-center">
    <div class="row row-cols-auto justify-content-center">

    {% for ph in photos %} 
      <div class="col m-2">
        <div class="card">
          <div class="card-body bg-body-tertiary">
            <img src="{{ph.img.url | get_thumbnail}}" alt="Post's image">
          </div>
          
          <div class="card-text">
            <p><strong>{{ph.title}}</strong><br>
              by {{ph.user.username}}<br>
              {% if user.is_authenticated and ph|is_liked:user %}
              <span class="btn badge rounded-pill text-bg-danger">{{ph | count_likes}}❤</span>
              {% else %}
              <span class="btn badge rounded-pill text-bg-light">{{ph | count_likes}}❤</span>
              {% endif %}
            </p>
          </div>
        </div>
      </div>
    {% endfor %}

    </div>
  </div>
